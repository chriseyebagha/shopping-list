<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Shopping List</title>
  <meta name="description" content="Your smart shopping companion" />
  <meta name="theme-color" content="#e67e22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ShopList" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Login -->
  <div id="loginOverlay">
    <div class="login-card">
      <div class="login-icon">🛒</div>
      <h1>Shopping List</h1>
      <p>Sign in to sync across devices</p>
      <div id="mainLoginOptions" class="login-actions">
        <button class="btn-login google" onclick="login()">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#fff" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.836.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" opacity=".3"/><path fill="#fff" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" opacity=".5"/><path fill="#fff" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" opacity=".3"/></svg>
          Continue with Google
        </button>
        <button class="btn-login phone" onclick="togglePhoneLogin()">Continue with Phone</button>
      </div>
      <div id="phoneFlow" class="phone-flow">
        <p class="phone-hint">Enter phone number (e.g. +15551234567)</p>
        <input type="tel" id="phoneInput" placeholder="+1..." />
        <div id="recaptcha-container"></div>
        <button id="sendCodeBtn" class="btn-login google" onclick="sendCode()">Send SMS Code</button>
        <div id="otpGroup" class="hidden">
          <input type="text" id="otpInput" placeholder="Enter 6-digit code" />
          <button class="btn-login google" onclick="verifyCode()">Verify & Sign In</button>
        </div>
        <button class="btn-text" onclick="cancelPhoneLogin()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Main app shell -->
  <div id="app" class="hidden">

    <!-- Top bar -->
    <header id="topBar" class="top-bar">
      <div id="userDisplay" class="user-display"></div>
      <div class="top-actions">
        <button class="top-icon-btn" onclick="openShareModal()" aria-label="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button id="shareActiveBtn" class="top-icon-btn" style="display:none" aria-label="Invite">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </button>
        <button class="top-icon-btn" onclick="toggleDarkMode()" aria-label="Dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="top-icon-btn signout" onclick="logout()" aria-label="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- List tabs -->
    <div id="listTabs" class="list-tabs"></div>

    <!-- Install banner -->
    <div id="installBanner" class="install-banner" onclick="installApp()">
      <span>📲 Add to home screen for the best experience</span>
      <button class="install-x" onclick="event.stopPropagation(); dismissInstall()">✕</button>
    </div>

    <!-- Progress bar -->
    <div id="progressWrap" class="progress-wrap hidden">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="progressText" class="progress-text"></span>
    </div>

    <!-- Main list area -->
    <div id="listArea" class="list-area"></div>

    <!-- Bottom input bar -->
    <div class="input-bar">
      <div class="input-bar-inner">
        <div class="autocomplete-wrap">
          <input type="text" id="itemInput" placeholder="Add an item..." autocomplete="off" enterkeyhint="done" />
          <div id="autocomplete" class="autocomplete-list hidden"></div>
        </div>
        <button id="voiceBtn" class="voice-btn" onclick="startVoice()" aria-label="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="addBtn" class="add-btn" aria-label="Add item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Share modal -->
  <div id="shareModal" class="sheet-overlay" onclick="if(event.target===this)closeShareModal()">
    <div class="sheet" id="shareSheet"></div>
  </div>

  <!-- Pull-to-refresh -->
  <div id="pullIndicator" class="pull-indicator"><span class="pull-arrow">↓</span></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Completion celebration -->
  <div id="celebration" class="celebration hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
