<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Shopping List</title>
  <meta name="description" content="Your smart, learning shopping companion" />
  <meta name="theme-color" content="#e67e22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ShopList" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Login -->
  <div id="loginOverlay">
    <div class="login-box">
      <h1>Shopping List</h1>
      <p>Sign in to sync your items across devices.</p>
      <div id="mainLoginOptions" class="login-options">
        <button class="auth-btn google" onclick="login()">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#fff" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.836.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" opacity=".3"/><path fill="#fff" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" opacity=".5"/><path fill="#fff" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" opacity=".3"/></svg>
          Sign in with Google
        </button>
        <button class="auth-btn phone" onclick="togglePhoneLogin()">📱 Sign in with Phone</button>
      </div>
      <div id="phoneFlow" class="phone-flow">
        <p style="font-size:0.88rem;color:var(--text-secondary)">Enter phone number (e.g. +15551234567)</p>
        <input type="tel" id="phoneInput" placeholder="+1..." />
        <div id="recaptcha-container"></div>
        <button id="sendCodeBtn" class="auth-btn google" onclick="sendCode()">Send SMS Code</button>
        <div id="otpGroup" class="hidden" style="display:flex;flex-direction:column;gap:10px">
          <input type="text" id="otpInput" placeholder="Enter 6-digit code" style="text-align:center;letter-spacing:3px" />
          <button class="auth-btn google" onclick="verifyCode()">Verify & Sign In</button>
        </div>
        <button class="secondary-btn" onclick="cancelPhoneLogin()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Top bar (sticky) -->
  <div id="topBar" class="top-bar hidden">
    <div id="userDisplay" class="user-info"></div>
    <div class="top-bar-actions">
      <button class="icon-btn" onclick="openShareModal()" title="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button id="shareActiveBtn" class="icon-btn" style="display:none" title="Invite">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleDarkMode()" title="Dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">

    <!-- Install banner -->
    <div id="installBanner" class="install-banner" onclick="installApp()">
      <div>
        <div class="install-text">Install Shopping List</div>
        <div class="install-sub">Add to home screen for the best experience</div>
      </div>
      <button class="install-dismiss" onclick="event.stopPropagation(); dismissInstall()">✕</button>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>Shopping <span class="highlight">List</span></h1>
      <p>Your smart, learning shopping companion</p>
    </div>

    <!-- List tabs -->
    <div id="listTabs" class="list-mode-bar"></div>

    <!-- Sticky add section -->
    <div class="add-section">
      <h3>Add Item</h3>
      <form id="addForm" class="add-form">
        <div class="add-row">
          <input type="text" id="itemInput" name="item" placeholder="e.g. Milk, Batteries..." required autocomplete="off" />
          <button type="button" id="storePickerBtn" class="store-picker-btn" onclick="openStorePicker()">
            Store... <span class="chevron">▼</span>
          </button>
        </div>
        <div class="add-row-bottom">
          <input type="number" id="qtyInput" name="qty" value="1" min="1" max="99" />
          <button type="button" id="voiceBtn" class="voice-btn" onclick="startVoice()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button type="submit" class="submit-btn">Add to List</button>
        </div>
      </form>
    </div>

    <!-- Active list -->
    <div id="activeListContainer" class="active-list"></div>

    <!-- Actions -->
    <div class="actions">
      <button onclick="clearChecked()">Clear Checked</button>
      <button class="danger" onclick="clearAll()">Reset List</button>
    </div>

    <!-- Divider + collapsible suggestions -->
    <div class="divider"><span>Suggestions</span></div>

    <div class="suggestions-header">
      <button id="suggestionsToggle" class="suggestions-toggle" onclick="toggleSuggestions()">
        <svg class="toggle-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        Suggested Items
      </button>
      <span id="suggestionsCountBadge" class="suggestions-count">0</span>
    </div>

    <div id="suggestionsContent">
      <!-- Search -->
      <div class="search-bar">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search suggestions..." />
      </div>
      <div id="suggestionsInner"></div>
    </div>

    <div class="footer">Shopping List v2.1</div>
  </div>

  <!-- Store picker bottom sheet -->
  <div id="storeSheet" class="bottom-sheet-overlay" onclick="if(event.target===this)closeStorePicker()">
    <div class="bottom-sheet">
      <div class="bottom-sheet-handle"></div>
      <h3>Pick a Store</h3>
      <div id="storeGridContainer"></div>
    </div>
  </div>

  <!-- Share modal -->
  <div id="shareModal" class="modal-overlay" onclick="if(event.target===this)closeShareModal()">
    <div class="modal" id="shareModalContent"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
